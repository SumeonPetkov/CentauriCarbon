# Left navigation bar, included by every screen (`include = ["sidebar"]`).
# `on_if = "@home"` is resolved at build time: true only on the home screen.

[[widget]]
type = "toggle"
at = [4, 4, 60, 62]
icon = "home"
icon_on = "home_on"
on_if = "@home"
bg = "none"
tap = "goto home"

[[widget]]
type = "toggle"
at = [4, 72, 60, 62]
icon = "control"
icon_on = "control_on"
on_if = "@control"
bg = "none"
tap = "goto control"

[[widget]]
type = "toggle"
at = [4, 140, 60, 62]
icon = "tools"
icon_on = "tools_on"
on_if = "@tools"
bg = "none"
tap = "goto tools"

[[widget]]
type = "toggle"
at = [4, 208, 60, 62]
icon = "settings"
icon_on = "settings_on"
on_if = "@system"
bg = "none"
tap = "goto system"
