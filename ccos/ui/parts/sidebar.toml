# Left navigation bar, included by every screen (`include = ["sidebar"]`).
# `on_if = "@home"` is resolved at build time: true only on the home screen.

[[widget]]
type = "toggle"
at = [4, 2, 60, 52]
icon = "home"
icon_on = "home_on"
on_if = "@home"
bg = "none"
tap = "goto home"

